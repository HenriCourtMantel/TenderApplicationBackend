<div class="border border-amber-200 bg-amber-50/20 rounded-xl p-5 shadow-sm transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 shrink-0">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <div>
            <span class="inline-flex items-center px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-wider rounded">{{ tender.category.name }}</span>
            <h4 class="font-bold text-slate-900 text-base mt-1">{{ tender.title }}</h4>
            <div class="flex items-center gap-2 mt-1.5">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                    Waiting for Payment
                </span>
                <span class="text-xs text-slate-500">Invoice created</span>
            </div>
        </div>
    </div>
    <div class="text-right shrink-0 border-t sm:border-t-0 pt-3 sm:pt-0 w-full sm:w-auto">
        <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Publication Fee</p>
        <p class="font-extrabold text-slate-900 text-lg mt-0.5">100.00 <span class="text-xs font-bold text-slate-500">{{ tender.currency.code }}</span></p>
    </div>
</div>
