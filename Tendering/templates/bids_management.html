{% extends 'base.html' %}

{% block content %}
<div class="p-8 max-w-[1600px] mx-auto space-y-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Bid Directory</h1>
            <p class="text-sm text-slate-500 mt-1">Review all proposals submitted across the platform.</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        <th class="py-4 px-6">Bid Info</th>
                        <th class="py-4 px-6">Target Tender</th>
                        <th class="py-4 px-6">Bidder Contact</th>
                        <th class="py-4 px-6">Value / Timeline</th>
                        <th class="py-4 px-6">Status</th>
                        <th class="py-4 px-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                    {% for bid in bids %}
                        {% include 'partials/bid_table_row.html' %}
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
